# Comments (giscus, GitHub Discussions) for every page in this folder.
# The share buttons above the comments are added automatically by the
# site-wide share script whenever comments are on.
comments:
  giscus:
    repo: rispace/rispace.github.io
    repo-id: R_kgDOMV8crA
    category: Announcements
