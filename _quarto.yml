project:
  type: website
  output-dir: docs
  resources:
    - ads.txt
    - langevin.js
    - LICENSE.txt
    - _assets/images/favicon.svg
    - _assets/images/apple-touch-icon.png
    - _assets/documents/*

website:
  title: "Mohammad Rafiqul Islam"
  description: "Mohammad Rafiqul Islam — postdoctoral research associate in probability at Iowa State University. Langevin dynamics, MCMC, and stochastic optimization."
  site-url: "https://rispace.github.io/"
  favicon: "_assets/images/favicon.ico"
  image: "_assets/images/rafiq-islam.jpeg"
  open-graph: true
  twitter-card: true
  page-navigation: false
  back-to-top-navigation: true
  bread-crumbs: false
  google-analytics:
    tracking-id: "G-J42B20L4ER"
    anonymize-ip: true

  navbar:
    logo: "_assets/images/mri-logo.svg"
    logo-alt: "MRI — Mohammad Rafiqul Islam, home"
    title: false
    pinned: true
    collapse-below: lg
    right:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: about.qmd
        text: About
      - href: cv.qmd
        text: CV
      - href: blog.qmd
        text: Notebook

  page-footer:
    border: false
    left: |
      <div class="foot-col">
      <a class="foot-mark" href="/index.html" aria-label="Home"><img src="/_assets/images/mri-logo.svg" alt="MRI"></a>
      <span>Copyright 2026 @ Dr. Rafiq Islam</span>
      <span>All rights reserved</span>
      <span><a href="/LICENSE.txt">License</a></span>
      <span>Powered by <a href="https://quarto.org/">Quarto</a></span>
      </div>
    center: |
      <div class="foot-col">
      <strong>Contact</strong>
      <span>Department of Mathematics</span>
      <span>Iowa State University</span>
      <span>Room 461, Carver Hall</span>
      <span>411 Morrill Road</span>
      <span>Ames, IA 50011</span>
      <span><a href="mailto:mri@iastate.edu">mri@iastate.edu</a></span>
      </div>
    right: |
      <div class="foot-col">
      <strong>Connect</strong>
      <div class="foot-links">
      <a href="mailto:mri@iastate.edu"><i class="bi bi-envelope"></i>Email</a>
      <a href="https://github.com/rispace"><i class="bi bi-github"></i>GitHub</a>
      <a href="https://www.linkedin.com/in/mohammad-rafiqul-islam/"><i class="bi bi-linkedin"></i>LinkedIn</a>
      <a href="https://scholar.google.com/citations?user=gTz5r68AAAAJ&hl=en"><i class="bi bi-mortarboard"></i>Google Scholar</a>
      <a href="https://youtube.com/@quanttube"><i class="bi bi-youtube"></i>YouTube</a>
      <a href="https://twitter.com/rafiqr35"><i class="bi bi-twitter"></i>Twitter</a>
      </div>
      </div>

execute:
  freeze: auto

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    toc: false
    smooth-scroll: true
    anchor-sections: false
    link-external-icon: false
    link-external-newwindow: true
    code-copy: true
    highlight-style: github
    include-in-header: _includes/head.html
    include-after-body: _includes/site-scripts.html
