format:
  html:
    theme: 
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    toc: true
    grid: 
      sidebar-width: 245px
      body-width: 1050px
      margin-width: 80px
      gutter-width: 1.5rem
    code-copy: true
    code-overflow: scroll
    code-line-numbers: false
    highlight-style: ayu-dark
    code-tools: true
    code-fold: false
    code-block-bg: false
    code-block-border-left: true
    minimal: false
    anchor-sections: true
    smooth-scroll: true
    include-after-body:
      - link-behavior.html
      - research-animation.html
    toc-location: left
    
    
