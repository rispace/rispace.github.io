<script>
// Keep navbar and in-page navigation in the current tab; open content links separately.
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll('a[href]').forEach(function (link) {
    const href = link.getAttribute('href');
    if (link.closest('.navbar')) {
      link.removeAttribute('target');
      link.removeAttribute('rel');
    } else if (href && !href.startsWith('#') && !href.startsWith('javascript:')) {
      link.setAttribute('target', '_blank');
      link.setAttribute('rel', 'noopener noreferrer');
    }
  });

  document.querySelectorAll('.bibtex-copy').forEach(function (button) {
    button.addEventListener('click', function () {
      const source = document.getElementById(button.dataset.copyTarget);
      if (!source) return;
      const citation = source.textContent.trim();
      const previous = button.textContent;
      button.textContent = 'Copied';

      const fallbackCopy = function () {
        const field = document.createElement('textarea');
        field.value = citation;
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        field.select();
        document.execCommand('copy');
        field.remove();
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(citation).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
      setTimeout(function () { button.textContent = previous; }, 1600);
    });
  });

  document.querySelectorAll('.bibtex-dropdown').forEach(function (details) {
    details.addEventListener('toggle', function () {
      if (!details.open) return;
      document.querySelectorAll('.bibtex-dropdown[open]').forEach(function (other) {
        if (other !== details) other.removeAttribute('open');
      });
    });
  });

  document.addEventListener('click', function (event) {
    document.querySelectorAll('.bibtex-dropdown[open]').forEach(function (details) {
      if (!details.contains(event.target)) details.removeAttribute('open');
    });
  });
});
</script>
